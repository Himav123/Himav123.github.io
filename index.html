<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chemistry Quiz Game (12 Questions)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    body {
      margin: 0;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      width: min(520px, 95vw);
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 18px;
      margin: 0;
      letter-spacing: 0.2px;
    }

    .pill {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #0b1220;
      border: 1px solid #1e293b;
      color: #cbd5e1;
      white-space: nowrap;
    }

    .question {
      margin: 14px 0 12px;
      font-size: 16px;
      line-height: 1.4;
      padding: 12px;
      background: #0b1220;
      border: 1px solid #1e293b;
      border-radius: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .opt {
      width: 100%;
      text-align: left;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid #1e293b;
      background: #1e293b;
      color: #e5e7eb;
      cursor: pointer;
      font-size: 15px;
      transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .opt:hover { background: #334155; }
    .opt:active { transform: scale(0.99); }

    .opt.correct {
      background: #14532d;
      border-color: #22c55e;
    }
    .opt.wrong {
      background: #7f1d1d;
      border-color: #ef4444;
    }
    .opt.reveal {
      background: #0b1220;
    }

    .msg {
      min-height: 22px;
      font-size: 14px;
      color: #fde68a;
      margin: 6px 2px 10px;
    }

    .bottom {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid #1e293b;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { filter: brightness(1.05); }
    .btn.secondary {
      background: #111827;
      color: #cbd5e1;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="top">
      <h1>🧪 Chemistry Quiz Game</h1>
      <div class="pill" id="progressPill">Q 1 / 12</div>
    </div>

    <div class="pill" id="scorePill">Score: 0</div>

    <div class="question" id="questionText">Loading…</div>

    <div class="grid" id="optionsWrap"></div>

    <div class="msg" id="message"></div>

    <div class="bottom">
      <button class="btn secondary" id="restartBtn" onclick="restartQuiz()">Restart</button>
      <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Next</button>
    </div>

    <div class="footer">If you get all correct, we may give you a candy! 😀</div>
  </div>

<script>
  // 12 questions (aligned with atom structure, ions, inertness, isotopes, stability)
  const quiz = [
    {
      q: "Which particle determines the identity of an element?",
      options: ["Electron", "Neutron", "Proton", "Nucleus"],
      answer: 2
    },
    {
      q: "The atomic number (Z) is equal to the number of:",
      options: ["Electrons", "Neutrons", "Protons", "Nucleons"],
      answer: 2
    },
    {
      q: "Which particle mainly controls chemical behaviour?",
      options: ["Protons", "Neutrons", "Electrons", "Nucleus"],
      answer: 2
    },
    {
      q: "Valence electrons are:",
      options: [
        "Electrons in the nucleus",
        "Electrons in the outermost shell",
        "All electrons in an atom",
        "Electrons in the first shell"
      ],
      answer: 1
    },
    {
      q: "Which electron count matches a noble-gas configuration (in a simple shell model)?",
      options: ["8", "10", "12", "16"],
      answer: 1
    },
    {
      q: "Which of the following is a noble-gas electron count?",
      options: ["6", "10", "14", "20"],
      answer: 1
    },
    {
      q: "Removing one electron from Neon makes it:",
      options: ["A new element", "An isotope", "Chemically reactive", "Still inert"],
      answer: 2
    },
    {
      q: "What causes nuclear stability in an atom?",
      options: ["Full valence shell", "Correct neutron–proton ratio", "Neutral charge", "More electrons"],
      answer: 1
    },
    {
      q: "Atoms of the same element but different neutrons are called:",
      options: ["Ions", "Isotopes", "Isobars", "Molecules"],
      answer: 1
    },
    {
      q: "Which change creates an ion?",
      options: ["Changing neutrons", "Changing protons", "Changing electrons", "Changing nucleus size"],
      answer: 2
    },
    {
      q: "Chemical stability and nuclear stability are:",
      options: ["Always linked", "The same thing", "Independent properties", "Controlled by neutrons only"],
      answer: 2
    },
    {
      q: "Which statement is TRUE?",
      options: [
        "All inert atoms are nuclear-stable",
        "All stable nuclei are inert",
        "Electrons control nuclear stability",
        "Chemical and nuclear stability are different"
      ],
      answer: 3
    }
  ];

  let index = 0;
  let score = 0;
  let locked = false;

  const questionText = document.getElementById("questionText");
  const optionsWrap = document.getElementById("optionsWrap");
  const message = document.getElementById("message");
  const nextBtn = document.getElementById("nextBtn");
  const progressPill = document.getElementById("progressPill");
  const scorePill = document.getElementById("scorePill");

  function loadQuestion() {
    locked = false;
    nextBtn.disabled = true;
    message.textContent = "Choose an option.";

    const q = quiz[index];
    questionText.textContent = q.q;
    progressPill.textContent = `Q ${index + 1} / ${quiz.length}`;
    scorePill.textContent = `Score: ${score}`;

    optionsWrap.innerHTML = "";
    q.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "opt";
      btn.textContent = opt;
      btn.onclick = () => checkAnswer(btn, i);
      optionsWrap.appendChild(btn);
    });
  }

  function checkAnswer(button, choice) {
    if (locked) return;
    locked = true;
    nextBtn.disabled = false;

    const correct = quiz[index].answer;
    const buttons = document.querySelectorAll(".opt");

    // reveal correct
    buttons.forEach(b => b.classList.add("reveal"));
    buttons[correct].classList.add("correct");

    if (choice === correct) {
      score++;
      message.textContent = "✅ Correct!";
    } else {
      button.classList.add("wrong");
      message.textContent = "❌ Incorrect — correct answer highlighted.";
    }

    scorePill.textContent = `Score: ${score}`;
  }

  function nextQuestion() {
    index++;
    if (index >= quiz.length) {
      const percent = Math.round((score / quiz.length) * 100);
      alert(`Quiz complete!\nFinal score: ${score} / ${quiz.length} (${percent}%)`);
      restartQuiz();
      return;
    }
    loadQuestion();
  }

  function restartQuiz() {
    index = 0;
    score = 0;
    locked = false;
    loadQuestion();
  }

  loadQuestion();
</script>
</body>
</html>
